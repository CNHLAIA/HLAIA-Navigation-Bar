services:
  hlaia-nav:
    build:
      context: .
      # 把 REGISTRY 传给 Dockerfile，让 FROM 从局域网 Registry 拉基础镜像。
      # REGISTRY 在 .env 中定义（与 push/pull 用的 REGISTRY 是同一个）。
      # 不传时 Dockerfile 默认 docker.io/library，走 Docker Hub（需外网）。
      args:
        REGISTRY: ${REGISTRY}
    image: "${REGISTRY}/hlaia-navigation-bar:latest"
    container_name: hlaia-nav
    restart: unless-stopped
    env_file:
      - .env
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-prod}
      TZ: ${TZ:-Asia/Shanghai}

  hlaia-nav-frontend:
    build:
      context: ./frontend
      args:
        REGISTRY: ${REGISTRY}
    image: "${REGISTRY}/hlaia-nav-frontend:latest"
    container_name: hlaia-nav-frontend
    restart: unless-stopped
    ports:
      - "13566:80"
    environment:
      TZ: Asia/Shanghai
    depends_on:
      - hlaia-nav
