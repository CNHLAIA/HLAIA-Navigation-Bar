# 部署到飞牛 NAS 时的生产环境配置
# 通过 SPRING_PROFILES_ACTIVE=prod 激活

spring:
  datasource:
    url: "${MYSQL_URL:jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:hlaia_nav}?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai}"
    username: ${MYSQL_USERNAME:root}
    password: ${MYSQL_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: ${REDIS_DATABASE:3}
    elasticsearch:
      repositories:
        enabled: true

  kafka:
    bootstrap-servers: "${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}"
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
    consumer:
      group-id: ${KAFKA_GROUP_ID_PROD:hlaia-nav}
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      auto-offset-reset: earliest

  flyway:
    enabled: true
    locations: classpath:db/migration

  elasticsearch:
    uris: "${ELASTICSEARCH_URI:http://localhost:9200}"

app:
  redis:
    key-prefix: "${APP_REDIS_KEY_PREFIX:hlaia_nav_prod:}"

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: auto

jwt:
  secret: ${JWT_SECRET}
  access-token-expiration: ${JWT_ACCESS_TOKEN_EXPIRATION:86400000}
  refresh-token-expiration: ${JWT_REFRESH_TOKEN_EXPIRATION:604800000}

logging:
  level:
    com.hlaia: info
