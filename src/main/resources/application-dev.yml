spring:
  datasource:
    url: "${MYSQL_URL:jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:hlaia_nav_dev}?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai}"
    username: ${MYSQL_USERNAME:root}
    password: ${MYSQL_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: ${REDIS_DATABASE:3}
    elasticsearch:
      repositories:
        enabled: true

  flyway:
    enabled: true
    locations: classpath:db/migration

  elasticsearch:
    uris: "${ELASTICSEARCH_URI:http://localhost:9200}"

app:
  redis:
    key-prefix: "${APP_REDIS_KEY_PREFIX:hlaia_nav_dev:}"

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto

jwt:
  secret: ${JWT_SECRET}
  access-token-expiration: ${JWT_ACCESS_TOKEN_EXPIRATION:86400000}
  refresh-token-expiration: ${JWT_REFRESH_TOKEN_EXPIRATION:31536000000}

logging:
  level:
    com.hlaia: debug
